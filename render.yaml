# Render 무료 웹 서비스 설정 (고정 주소: https://<서비스이름>.onrender.com)
# Render 대시보드 → New → Blueprint → 이 GitHub 저장소를 고르면 아래 설정으로 만들어져요.
# GitHub 에 push 할 때마다 자동으로 새 버전이 올라가요.
services:
  - type: web
    name: reffy
    runtime: python
    plan: free
    rootDir: reffy-web
    buildCommand: pip install -r requirements.txt onnx && python tools/quantize_tagger.py
    startCommand: python run.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: HOST
        value: 0.0.0.0
      - key: LAYOUT
        value: auto          # 화면 폭에 따라 PC / 모바일 화면 자동
      - key: NO_LOGIN
        value: "1"
      - key: LOCAL_ADMIN
        value: "0"           # 클라우드에서는 관리자(아무 글 삭제) 권한 끔
      - key: TAGGER
        value: auto          # WD14 태거 사용
      - key: TAGGER_INT8
        value: "1"           # 무료 서버 메모리(512MB)에 맞게 빌드 때 int8 로 줄인 모델만 사용
      - key: SEED_DIR
        value: demo-data     # 처음 켤 때(DB 가 비어 있을 때) reffy-web/demo-data 의 게시물 · 이미지로 시작
      # ↓ Supabase 에 저장하려면 Render 대시보드 → reffy → Environment 에서 값을 직접 넣어 주세요 (깃허브에 올리지 않음)
      - key: DB_URL          # Supabase → Connect → Session pooler 주소 (postgresql://postgres.xxxx:비밀번호@...pooler.supabase.com:5432/postgres)
        sync: false
      - key: SUPABASE_URL    # Supabase → Project Settings → API → Project URL
        sync: false
      - key: SUPABASE_KEY    # Supabase → Project Settings → API Keys → service_role (secret) 키
        sync: false
